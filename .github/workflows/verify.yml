name: Verify counterexample

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify in isolated mode
        run: python -I verify_domb_lucas_counterexample.py
      - name: Verify with optimization and isolation
        run: python -OO -I verify_domb_lucas_counterexample.py
